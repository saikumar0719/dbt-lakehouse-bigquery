version: 2

models:
  - name: dim_customers
    description: Customer dimension with lifetime order behavior.
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
  - name: dim_products
    description: Product dimension with lifetime sales.
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
  - name: fct_orders
    description: Order fact, one row per order.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: product_id
        tests:
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: status
        tests:
          - accepted_values:
              values: ['completed', 'cancelled', 'refunded']
